services:
  - type: web
    name: werewolf-identity-predictor
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --chdir backend"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
